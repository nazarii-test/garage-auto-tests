name: Playwright Tests (VM)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=e2e tests/expenses.spec.ts tests/garage.spec.ts tests/profile.spec.ts tests/signin.spec.ts
        env:
          HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          HTTPS_PASSWORD: ${{ secrets.HTTPS_PASSWORD }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 2